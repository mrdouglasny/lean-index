[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-index"
version = "0.1.0"
description = "Cross-repository index of Lean 4 declarations, filterable by mathematical topic"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{ name = "mrdouglasny" }]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
lean-index = "leanindex.cli:main"

[tool.setuptools.packages.find]
include = ["leanindex*"]
