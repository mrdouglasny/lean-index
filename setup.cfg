[metadata]
name = lean-index
version = 0.1.0
description = Cross-repository index of Lean 4 declarations, filterable by mathematical topic

[options]
packages = find:
python_requires = >=3.9
install_requires =
    click>=8.0
    pyyaml>=6.0
    requests>=2.28
    beautifulsoup4>=4.12

[options.packages.find]
include = leanindex*

[options.entry_points]
console_scripts =
    lean-index = leanindex.cli:main
